<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Solar System · an interactive orrery</title>
<meta name="description" content="An interactive 3D solar system. Every planet surface, ring and glow is drawn procedurally at load, with Three.js and no external assets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e6b463'/%3E%3Cellipse cx='16' cy='16' rx='15' ry='6' fill='none' stroke='%23ece9e2' stroke-opacity='0.55' stroke-width='1.2' transform='rotate(-24 16 16)'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #05070b;
    --ink: #ece9e2;
    --muted: #8b909a;
    --line: rgba(236, 233, 226, 0.13);
    --line-strong: rgba(236, 233, 226, 0.26);
    --amber: #e6b463;
    --panel: rgba(7, 9, 14, 0.72);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --pad: 24px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #viewport {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    z-index: 0;
  }

  #vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse 78% 68% at 50% 46%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.5) 100%);
  }

  /* ---------- body labels ---------- */

  .labels {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .label {
    position: absolute;
    top: 0;
    left: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    margin: 0;
    background: none;
    border: 0;
    color: rgba(236, 233, 226, 0.62);
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    pointer-events: auto;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    will-change: transform, opacity;
    transition: color 160ms ease;
  }

  .label:hover { color: var(--ink); }

  .label:focus-visible {
    outline: 1px solid var(--amber);
    outline-offset: 1px;
  }

  .label.is-active { color: var(--amber); }

  .label-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--dot, currentColor);
    opacity: 0.85;
    flex: none;
  }

  /* ---------- type ---------- */

  .kicker {
    margin: 0;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- brand ---------- */

  .brand {
    position: fixed;
    top: var(--pad);
    left: var(--pad);
    z-index: 3;
    max-width: 300px;
    pointer-events: none;
  }

  .brand h1 {
    margin: 10px 0 0;
    font-family: var(--serif);
    font-size: clamp(24px, 2.6vw, 34px);
    font-weight: 400;
    line-height: 0.98;
    letter-spacing: -0.015em;
  }

  .brand-sub {
    margin: 10px 0 0;
    max-width: 30ch;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--muted);
  }

  /* ---------- inspector ---------- */

  .inspector {
    position: fixed;
    top: var(--pad);
    right: var(--pad);
    z-index: 3;
    width: 236px;
    padding: 14px 16px 13px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  .inspector h2 {
    margin: 9px 0 12px;
    font-family: var(--serif);
    font-size: 27px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .facts { margin: 0; }

  .fact {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-top: 1px solid var(--line);
  }

  .fact dt {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .fact dd {
    margin: 0;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    text-align: right;
    color: var(--ink);
  }

  .inspector-note {
    margin: 12px 0 0;
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  /* ---------- transport ---------- */

  .transport {
    position: fixed;
    left: var(--pad);
    bottom: var(--pad);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 30px;
    padding: 7px 11px;
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 11.5px;
    line-height: 1;
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }

  .btn:hover {
    background: rgba(236, 233, 226, 0.07);
    border-color: rgba(236, 233, 226, 0.42);
  }

  .btn:active { background: rgba(236, 233, 226, 0.13); }

  .btn:focus-visible {
    outline: 1px solid var(--amber);
    outline-offset: 2px;
  }

  .btn .icon {
    width: 9px;
    height: 9px;
    display: block;
    flex: none;
  }

  .btn[data-state="playing"] .icon-play,
  .btn[data-state="paused"] .icon-pause { display: none; }

  .speed {
    display: grid;
    grid-template-columns: auto 128px 44px;
    align-items: center;
    gap: 10px;
  }

  .speed .kicker { letter-spacing: 0.16em; }

  .speed output {
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink);
  }

  input[type="range"] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    height: 16px;
    margin: 0;
    background: transparent;
    cursor: pointer;
    --fill: 53%;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 1px;
    border: 0;
    background: linear-gradient(
      to right,
      var(--amber) 0,
      var(--amber) var(--fill),
      rgba(236, 233, 226, 0.22) var(--fill),
      rgba(236, 233, 226, 0.22) 100%
    );
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    margin-top: -4.5px;
    border: 0;
    border-radius: 50%;
    background: var(--amber);
  }

  input[type="range"]::-moz-range-track {
    height: 1px;
    border: 0;
    background: rgba(236, 233, 226, 0.22);
  }

  input[type="range"]::-moz-range-progress {
    height: 1px;
    background: var(--amber);
  }

  input[type="range"]::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border: 0;
    border-radius: 50%;
    background: var(--amber);
  }

  input[type="range"]:focus-visible {
    outline: 1px solid var(--amber);
    outline-offset: 4px;
  }

  /* ---------- hint ---------- */

  .hint {
    position: fixed;
    right: var(--pad);
    bottom: var(--pad);
    z-index: 3;
    max-width: 300px;
    margin: 0;
    text-align: right;
    color: var(--muted);
    pointer-events: none;
  }

  .hint-line {
    margin: 0;
    font-family: var(--mono);
    font-size: 9.5px;
    line-height: 2;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .hint .scale {
    margin: 4px 0 0;
    font-size: 10.5px;
    line-height: 1.5;
    opacity: 0.8;
  }

  /* ---------- boot ---------- */

  #boot {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: var(--bg);
    transition: opacity 520ms ease;
  }

  #boot.is-hidden {
    opacity: 0;
    pointer-events: none;
  }

  .boot-inner { width: 190px; text-align: left; }

  .boot-mark {
    margin: 0 0 14px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .boot-note {
    margin: 0 0 14px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  .boot-note.is-error { color: #e08f6c; }

  .boot-bar {
    height: 1px;
    background: var(--line);
    overflow: hidden;
  }

  .boot-bar i {
    display: block;
    width: 30%;
    height: 1px;
    background: var(--amber);
    animation: sweep 1.15s cubic-bezier(0.45, 0, 0.35, 1) infinite;
  }

  @keyframes sweep {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  noscript p {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 24px;
    background: var(--bg);
    z-index: 20;
    font-size: 14px;
    color: var(--ink);
  }

  /* ---------- responsive ---------- */

  @media (max-width: 900px) {
    .hint {
      left: var(--pad);
      right: var(--pad);
      bottom: 66px;
      max-width: none;
      text-align: center;
    }

    .hint-line { font-size: 9px; letter-spacing: 0.08em; }
    .hint-line + .hint-line,
    .hint .scale { display: none; }
  }

  @media (max-width: 700px) {
    :root { --pad: 16px; }

    .brand { max-width: 210px; }
    .brand-sub { display: none; }
    .brand h1 { font-size: 24px; }

    .inspector {
      top: 14px;
      right: 14px;
      width: 168px;
      padding: 10px 12px;
    }

    .inspector h2 { font-size: 20px; margin: 7px 0 9px; }
    .fact { padding: 4px 0; }
    .fact dt { font-size: 8.5px; letter-spacing: 0.06em; }
    .fact dd { font-size: 9.5px; }
    .inspector-note { display: none; }

    .transport {
      left: 12px;
      right: 12px;
      bottom: 12px;
      gap: 10px;
      padding: 8px 10px;
      justify-content: space-between;
    }

    .speed {
      grid-template-columns: minmax(48px, 1fr) 40px;
      gap: 8px;
      flex: 1;
    }

    .speed .kicker { display: none; }

    .btn { padding: 7px 10px; font-size: 11px; }
    .btn .icon { width: 10px; height: 10px; }
    .label { font-size: 8.5px; letter-spacing: 0.1em; padding: 7px 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<canvas id="viewport" role="img" aria-label="Interactive 3D model of the solar system"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div class="labels" id="labels" aria-label="Bodies in the scene"></div>

<header class="brand">
  <p class="kicker">Procedural orrery</p>
  <h1>Solar System</h1>
  <p class="brand-sub">Eight planets and one moon, every surface drawn in canvas.</p>
</header>

<aside class="inspector" aria-live="polite">
  <p class="kicker" id="kind">Star</p>
  <h2 id="name">Sun</h2>
  <dl class="facts" id="facts"></dl>
  <p class="inspector-note" id="note"></p>
</aside>

<div class="transport" role="group" aria-label="Playback and view">
  <button class="btn" id="play" type="button" data-state="playing" aria-pressed="false" title="Pause (Space)">
    <svg class="icon icon-pause" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.2" y="1" width="2.4" height="8" fill="currentColor"/><rect x="6.4" y="1" width="2.4" height="8" fill="currentColor"/></svg>
    <svg class="icon icon-play" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1 9 5 2 9Z" fill="currentColor"/></svg>
    <span id="play-text">Pause</span>
  </button>

  <div class="speed">
    <label class="kicker" for="speed">Speed</label>
    <input id="speed" type="range" min="0" max="100" step="1" value="53" aria-label="Simulation speed">
    <output id="speed-value" for="speed">1.0&times;</output>
  </div>

  <button class="btn" id="overview" type="button" title="Overview (Esc)">Overview</button>
</div>

<div class="hint">
  <p class="hint-line">Drag to orbit &#183; pinch or scroll to zoom</p>
  <p class="hint-line">Click a body to follow &#183; Esc for overview</p>
  <p class="scale">Sizes, distances and spin are compressed.</p>
</div>

<div id="boot">
  <div class="boot-inner">
    <p class="boot-mark">Solar System</p>
    <p class="boot-note" id="boot-note">Drawing surfaces</p>
    <div class="boot-bar"><i></i></div>
  </div>
</div>

<noscript><p>This model needs JavaScript and WebGL to render.</p></noscript>

<script>
  window.setTimeout(function () {
    if (window.__solarReady) return;
    var note = document.getElementById('boot-note');
    if (note && !note.dataset.filled) {
      note.dataset.filled = '1';
      note.textContent = 'Three.js did not load. Check the network connection, then reload.';
      note.classList.add('is-error');
    }
  }, 12000);
</script>

/* ------------------------------------------------------------------ *
 * 3. Small utilities
 * ------------------------------------------------------------------ */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function clamp(v, min = 0, max = 1) {
  return v < min ? min : v > max ? max : v;
}

function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function mixRgb(a, b, t, out) {
  const k = clamp(t);
  out[0] = a[0] + (b[0] - a[0]) * k;
  out[1] = a[1] + (b[1] - a[1]) * k;
  out[2] = a[2] + (b[2] - a[2]) * k;
  return out;
}

function makeCanvas(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  return canvas;
}

/* Value noise on a wrapping lattice, so horizontal seams stay invisible. */
function makeLattice(seed, size) {
  const rand = mulberry32(seed);
  const grid = new Float32Array(size * size);
  for (let i = 0; i < grid.length; i += 1) grid[i] = rand();
  return grid;
}

function sampleLattice(grid, size, x, y) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);

  const x0 = ((xi % size) + size) % size;
  const y0 = ((yi % size) + size) % size;
  const x1 = (x0 + 1) % size;
  const y1 = (y0 + 1) % size;

  const a = grid[y0 * size + x0];
  const b = grid[y0 * size + x1];
  const c = grid[y1 * size + x0];
  const d = grid[y1 * size + x1];

  return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
}

/* Each octave gets its own lattice period so u = 1 wraps back onto u = 0.
   Lattice sizes must be integers, otherwise wrapping lands between cells. */
function makeFbm(seed, period, octaves = 4, gain = 0.5) {
  const layers = [];
  let amp = 1;
  let total = 0;
  let size = Math.max(2, Math.round(period));

  for (let o = 0; o < octaves; o += 1) {
    layers.push({ grid: makeLattice(seed + o * 977, size), size, amp });
    total += amp;
    amp *= gain;
    size *= 2;
  }

  return function fbm(u, v) {
    let sum = 0;
    for (let i = 0; i < layers.length; i += 1) {
      const layer = layers[i];
      sum += layer.amp * sampleLattice(layer.grid, layer.size, u * layer.size, v * layer.size * 0.5);
    }
    return sum / total;
  };
}

let maxAnisotropy = 4;

function toTexture(canvas, { repeatX = true, clampY = false } = {}) {
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = repeatX ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  texture.wrapT = clampY ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  texture.anisotropy = maxAnisotropy;
  texture.needsUpdate = true;
  return texture;
}

function rockyPainter(spec) {
  const base = hexToRgb(spec.base);
  const dark = hexToRgb(spec.dark);
  const light = hexToRgb(spec.light);
  const polar = spec.polar ? hexToRgb(spec.polar) : null;

  return function paint(u, v, lat, noiseA, noiseB, out) {
    const n = noiseA(u, v);
    const m = noiseB(u * 1.8, v * 1.4);

    mixRgb(dark, base, clamp((n - 0.4) * 2.6), out);
    mixRgb(out, light, clamp((m - 0.58) * 2.8) * 0.7, out);

    if (polar) {
      const cap = smoothstep(0.8, 0.94, lat + (m - 0.5) * 0.1);
      mixRgb(out, polar, cap * 0.95, out);
    }
  };
}

function gasPainter(spec) {
  const palette = spec.palette.map(hexToRgb);
  const bands = spec.bands;
  const warp = spec.warp;

  return function paint(u, v, lat, noiseA, noiseB, out) {
    const drift = (noiseB(u * 0.7, v * 2.1) - 0.5) * warp * 0.075;
    const belt = Math.sin((v + drift) * bands * TAU) * 0.5 + 0.5;
    const fine = noiseA(u * 1.2, v * 4.5);

    const idx = clamp(belt * (palette.length - 1) + (fine - 0.5) * 1.1, 0, palette.length - 1);
    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, palette.length - 1);
    mixRgb(palette[i0], palette[i1], idx - i0, out);

    const shade = 0.92 + fine * 0.14;
    out[0] = clamp(out[0] * shade);
    out[1] = clamp(out[1] * shade);
    out[2] = clamp(out[2] * shade);
  };
}

function earthPainter() {
  const deep = hexToRgb('#06182b');
  const shelf = hexToRgb('#10405c');
  const lowland = hexToRgb('#3c5f3b');
  const highland = hexToRgb('#6f6b46');
  const rock = hexToRgb('#8b7b5d');
  const desert = hexToRgb('#a08a55');
  const ice = hexToRgb('#e3ecf1');

  return function paint(u, v, lat, noiseA, noiseB, out) {
    /* Two noise scales: broad landmasses, then coastline detail. */
    const coarse = noiseA(u, v);
    const detail = noiseB(u * 2.7, v * 2.2);
    const height = coarse * 0.74 + detail * 0.26;
    const coast = 0.505;

    if (height < coast) {
      const depth = clamp((coast - height) / 0.34);
      mixRgb(shelf, deep, Math.pow(depth, 0.5), out);
      const glint = 0.9 + detail * 0.2;
      out[0] = clamp(out[0] * glint);
      out[1] = clamp(out[1] * glint);
      out[2] = clamp(out[2] * glint);
    } else {
      const elev = clamp((height - coast) / 0.17);
      mixRgb(lowland, highland, smoothstep(0.04, 0.6, elev), out);
      mixRgb(out, rock, smoothstep(0.55, 1, elev) * 0.85, out);

      const arid = smoothstep(0.28, 0.16, Math.abs(lat - 0.24)) * 0.34;
      mixRgb(out, desert, arid, out);
      mixRgb(out, lowland, (detail - 0.5) * 0.3, out);
    }

    const cap = smoothstep(0.86, 0.93, lat + (detail - 0.5) * 0.07);
    mixRgb(out, ice, cap, out);
  };
}

const PAINTERS = {
  rocky: rockyPainter,
  gas: gasPainter,
  earth: earthPainter,
};

function createSurfaceTexture(spec) {
  const W = 512;
  const H = 256;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(W, H);
  const data = image.data;

  const paint = PAINTERS[spec.kind](spec);
  const noiseA = makeFbm(spec.seed, spec.period || 8, spec.kind === 'gas' ? 4 : 5);
  const noiseB = makeFbm(spec.seed + 131, (spec.period || 8) * 0.75, 4);
  const out = [0, 0, 0];

  for (let y = 0; y < H; y += 1) {
    const v = y / (H - 1);
    const lat = Math.abs(v * 2 - 1);
    for (let x = 0; x < W; x += 1) {
      const u = x / W;
      paint(u, v, lat, noiseA, noiseB, out);
      const i = (y * W + x) * 4;
      data[i] = out[0] * 255;
      data[i + 1] = out[1] * 255;
      data[i + 2] = out[2] * 255;
      data[i + 3] = 255;
    }
  }

  ctx.putImageData(image, 0, 0);

  if (spec.craters) drawCraters(ctx, W, H, spec.craters, mulberry32(spec.seed + 5));
  if (spec.spot) drawStorm(ctx, W, H, spec.spotColor || '#a45238', mulberry32(spec.seed + 17));

  return toTexture(canvas);
}

function drawCraters(ctx, width, height, count, rand) {
  for (let i = 0; i < count; i += 1) {
    const x = rand() * width;
    const y = (0.05 + rand() * 0.9) * height;
    const radius = 2 + Math.pow(rand(), 3) * 16;

    const gradient = ctx.createRadialGradient(x, y, radius * 0.15, x, y, radius);
    gradient.addColorStop(0, 'rgba(18, 14, 10, 0.25)');
    gradient.addColorStop(0.62, 'rgba(18, 14, 10, 0.08)');
    gradient.addColorStop(0.82, 'rgba(255, 250, 240, 0.13)');
    gradient.addColorStop(1, 'rgba(255, 250, 240, 0)');

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, TAU);
    ctx.fill();
  }
}

function drawStorm(ctx, width, height, color, rand) {
  const x = width * (0.58 + rand() * 0.1);
  const y = height * 0.62;
  const rx = width * 0.075;
  const ry = height * 0.055;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, ry / rx);
  const gradient = ctx.createRadialGradient(0, 0, rx * 0.1, 0, 0, rx);
  gradient.addColorStop(0, color);
  gradient.addColorStop(0.55, color);
  gradient.addColorStop(0.85, 'rgba(160, 82, 56, 0.35)');
  gradient.addColorStop(1, 'rgba(160, 82, 56, 0)');
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function createCloudTexture(spec) {
  const W = 512;
  const H = 256;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(W, H);
  const data = image.data;

  const noise = makeFbm(spec.seed, spec.period || 12, 6);
  const swirl = makeFbm(spec.seed + 53, 5, 3);

  for (let y = 0; y < H; y += 1) {
    const v = y / (H - 1);
    const band = 0.52 + 0.48 * Math.sin(v * Math.PI * 7 + 0.4);
    for (let x = 0; x < W; x += 1) {
      const u = x / W;
      const shifted = u + (swirl(u, v) - 0.5) * 0.22;
      const n = noise(shifted, v * 1.35);
      const alpha = smoothstep(0.47, 0.73, n * band + 0.1);
      const i = (y * W + x) * 4;
      data[i] = 255;
      data[i + 1] = 255;
      data[i + 2] = 255;
      data[i + 3] = alpha * 228;
    }
  }

  ctx.putImageData(image, 0, 0);
  return toTexture(canvas);
}

function createSunTexture() {
  const W = 512;
  const H = 256;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(W, H);
  const data = image.data;

  const ember = hexToRgb('#f26a0b');
  const glow = hexToRgb('#ffb547');
  const core = hexToRgb('#fff3cf');
  const noise = makeFbm(313, 9, 5);
  const cells = makeFbm(421, 14, 4);
  const out = [0, 0, 0];

  for (let y = 0; y < H; y += 1) {
    const v = y / (H - 1);
    for (let x = 0; x < W; x += 1) {
      const u = x / W;
      const n = noise(u, v);
      const c = cells(u * 1.6, v * 1.6);
      const t = clamp(n * 1.15 + (c - 0.5) * 0.55 + 0.06);

      mixRgb(ember, glow, Math.pow(t, 0.8), out);
      mixRgb(out, core, clamp((t - 0.7) * 3.1), out);

      const i = (y * W + x) * 4;
      data[i] = out[0] * 255;
      data[i + 1] = out[1] * 255;
      data[i + 2] = out[2] * 255;
      data[i + 3] = 255;
    }
  }

  ctx.putImageData(image, 0, 0);
  return toTexture(canvas);
}

function createRingTexture(spec) {
  const W = 1024;
  const H = 8;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(W, H);
  const data = image.data;

  const inner = hexToRgb(spec.tones[0]);
  const outer = hexToRgb(spec.tones[1]);
  const noise = makeFbm(spec.seed, 32, 4);
  const out = [0, 0, 0];

  for (let x = 0; x < W; x += 1) {
    const t = x / (W - 1);
    const fine = noise(t, 0.4);
    const ripple = 0.5 + 0.5 * Math.sin(t * 48 + noise(t * 0.5 + 0.2, 0.7) * 6);

    let alpha = spec.density * (0.66 + 0.6 * fine) * (0.8 + 0.2 * ripple);

    if (spec.bright) {
      let boost = 0;
      for (let i = 0; i < spec.bright.length; i += 1) {
        const band = spec.bright[i];
        boost += Math.exp(-Math.pow((t - band.pos) / band.width, 2)) * band.strength;
      }
      alpha = Math.min(1, alpha * (0.18 + boost));
    }

    if (spec.gaps) {
      for (let i = 0; i < spec.gaps.length; i += 1) {
        const gap = spec.gaps[i];
        alpha *= 1 - 0.94 * Math.exp(-Math.pow((t - gap.pos) / gap.width, 2));
      }
    } else if (spec.density > 0.3) {
      alpha *= 1 - 0.9 * Math.exp(-Math.pow((t - 0.62) / 0.014, 2));
    }

    alpha *= smoothstep(0, 0.03, t) * smoothstep(1, 0.97, t);
    alpha = clamp(alpha);

    mixRgb(inner, outer, fine, out);

    for (let y = 0; y < H; y += 1) {
      const i = (y * W + x) * 4;
      data[i] = out[0] * 255;
      data[i + 1] = out[1] * 255;
      data[i + 2] = out[2] * 255;
      data[i + 3] = alpha * 255;
    }
  }

  ctx.putImageData(image, 0, 0);
  return toTexture(canvas, { repeatX: false, clampY: true });
}

function createRadialSprite(size, stops) {
  const canvas = makeCanvas(size, size);
  const ctx = canvas.getContext('2d');
  const half = size / 2;
  const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
  for (let i = 0; i < stops.length; i += 1) {
    gradient.addColorStop(stops[i][0], stops[i][1]);
  }
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function createStarSprite() {
  return createRadialSprite(64, [
    [0, 'rgba(255,255,255,1)'],
    [0.22, 'rgba(255,255,255,0.85)'],
    [0.5, 'rgba(255,255,255,0.22)'],
    [1, 'rgba(255,255,255,0)'],
  ]);
}

function createGlowSprite() {
  return createRadialSprite(256, [
    [0, 'rgba(255,246,222,1)'],
    [0.18, 'rgba(255,214,150,0.62)'],
    [0.42, 'rgba(255,150,52,0.2)'],
    [0.72, 'rgba(255,110,20,0.05)'],
    [1, 'rgba(255,90,0,0)'],
  ]);
}

function buildStarfield() {
  const sprite = createStarSprite();
  const group = new THREE.Group();
  scene.add(group);

  const layers = [
    { count: 6200, min: 900, max: 2500, size: 5, opacity: 0.8 },
    { count: 1600, min: 800, max: 2000, size: 9, opacity: 0.72 },
    { count: 220, min: 700, max: 1800, size: 14, opacity: 0.85 },
  ];

  const rand = mulberry32(2024);

  layers.forEach((layer, index) => {
    const positions = new Float32Array(layer.count * 3);
    const colors = new Float32Array(layer.count * 3);

    for (let i = 0; i < layer.count; i += 1) {
      const theta = rand() * TAU;
      const y = Math.acos(2 * rand() - 1) - Math.PI / 2;
      const radius = layer.min + rand() * (layer.max - layer.min);

      positions[i * 3] = Math.cos(theta) * Math.cos(y) * radius;
      positions[i * 3 + 1] = Math.sin(y) * radius;
      positions[i * 3 + 2] = Math.sin(theta) * Math.cos(y) * radius;

      const tint = rand();
      let r = 1;
      let g = 1;
      let b = 1;
      if (tint < 0.14) { r = 1; g = 0.83; b = 0.64; }
      else if (tint < 0.34) { r = 0.78; g = 0.86; b = 1; }

      const brightness = 0.4 + Math.pow(rand(), 2.2) * 0.6;
      colors[i * 3] = r * brightness;
      colors[i * 3 + 1] = g * brightness;
      colors[i * 3 + 2] = b * brightness;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: layer.size,
      map: sprite,
      vertexColors: true,
      transparent: true,
      opacity: layer.opacity,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true,
    });

    const points = new THREE.Points(geometry, material);
    points.renderOrder = -1;
    group.add(points);

    if (index === 2) starLayerBright = points;
  });

  /* A loose band of denser stars, the way the galactic plane reads from inside it. */
  const bandCount = 3000;
  const positions = new Float32Array(bandCount * 3);
  const colors = new Float32Array(bandCount * 3);

  for (let i = 0; i < bandCount; i += 1) {
    const theta = rand() * TAU;
    const spread = (rand() + rand() + rand() - 1.5) * 0.19;
    const radius = 1100 + rand() * 1300;
    const dir = new THREE.Vector3(Math.cos(theta), spread, Math.sin(theta)).normalize();

    positions[i * 3] = dir.x * radius;
    positions[i * 3 + 1] = dir.y * radius;
    positions[i * 3 + 2] = dir.z * radius;

    const brightness = 0.2 + Math.pow(rand(), 2) * 0.5;
    colors[i * 3] = brightness * 0.9;
    colors[i * 3 + 1] = brightness * 0.92;
    colors[i * 3 + 2] = brightness;
  }

  const bandGeometry = new THREE.BufferGeometry();
  bandGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  bandGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const band = new THREE.Points(bandGeometry, new THREE.PointsMaterial({
    size: 3.6,
    map: sprite,
    vertexColors: true,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  }));
  band.rotation.set(0.44, 0.6, 0.18);
  band.renderOrder = -1;
  group.add(band);

  scene.userData.stars = group;
}

function glowMaterial(innerHex, outerHex, power, strength) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uInner: { value: new THREE.Color(innerHex) },
      uOuter: { value: new THREE.Color(outerHex) },
      uPower: { value: power },
      uStrength: { value: strength },
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vView;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vNormal = normalize(normalMatrix * normal);
        vView = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform vec3 uInner;
      uniform vec3 uOuter;
      uniform float uPower;
      uniform float uStrength;
      varying vec3 vNormal;
      varying vec3 vView;
      void main() {
        float rim = pow(1.0 - abs(dot(vNormal, vView)), uPower);
        vec3 color = mix(uOuter, uInner, rim);
        gl_FragColor = vec4(color, rim * uStrength);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
}

    pickable: sunMesh,
  };
  sunMesh.userData.body = sunRecord;
  pickables.push(sunMesh);
  bodies.push(sunRecord);
}

/* ------------------------------------------------------------------ *
 * 9. Planets, moon, rings
 * ------------------------------------------------------------------ */

function makeOrbitLine(radius, color) {
  const points = [];
  const segments = 256;
  for (let i = 0; i <= segments; i += 1) {
    const angle = (i / segments) * TAU;
    points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
  }

  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({
    color: new THREE.Color(color),
    transparent: true,
    opacity: 0.19,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  return new THREE.LineLoop(geometry, material);
}

function makeRingMesh(inner, outer, texture) {
  const geometry = new THREE.RingGeometry(inner, outer, 192, 1);
  geometry.rotateX(-Math.PI / 2);

  const position = geometry.attributes.position;
  const uv = geometry.attributes.uv;
  const vertex = new THREE.Vector3();

  for (let i = 0; i < position.count; i += 1) {
    vertex.fromBufferAttribute(position, i);
    uv.setXY(i, (vertex.length() - inner) / (outer - inner), 0.5);
  }
  uv.needsUpdate = true;

  /* Real ring particles scatter light, so the face away from the Sun still
     glows. The emissive map keeps the ringlets readable from either side. */
  const material = new THREE.MeshStandardMaterial({
    map: texture,
    emissive: new THREE.Color(0xffffff),
    emissiveMap: texture,
    emissiveIntensity: 0.42,
    transparent: true,
    opacity: 0.95,
    alphaTest: 0.02,
    depthWrite: false,
    roughness: 1,
    metalness: 0,
    side: THREE.DoubleSide,
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.renderOrder = 1;
  return mesh;
}

function buildPlanets() {
  for (let index = 0; index < PLANET_SPECS.length; index += 1) {
    const spec = PLANET_SPECS[index];

    const radius = SIZE_BASE * Math.pow(spec.radiusRel, SIZE_POW);
    const distance = DIST_BASE + DIST_SCALE * Math.pow(spec.au, DIST_POW);
    const spinPeriod = 7 * Math.pow(spec.spinHours / 24, 0.4);

    const plane = new THREE.Object3D();
    plane.rotation.x = spec.inclination * DEG;
    scene.add(plane);

    const orbitLine = makeOrbitLine(distance, spec.color);
    plane.add(orbitLine);

    const pivot = new THREE.Object3D();
    plane.add(pivot);

    const tilt = new THREE.Object3D();
    tilt.rotation.z = spec.tilt * DEG;
    pivot.add(tilt);

    const texture = createSurfaceTexture(spec.surface);
    const material = new THREE.MeshStandardMaterial({
      map: texture,
      roughness: 0.94,
      metalness: 0.02,
    });

    const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 32), material);
    tilt.add(mesh);

    const body = {
      id: spec.id,
      name: spec.name,
      kind: 'Planet',
      color: spec.color,
      radius,
      distance,
      group: mesh,
      facts: spec.facts,
      fact: spec.fact,
      pickable: mesh,
      orbitLine,
      pivot,
      mesh,
      spinPeriod,
      spinDir: spec.spinDir || 1,
      periodYears: spec.periodYears,
      startAngle: spec.start,
    };

    mesh.userData.body = body;
    pickables.push(mesh);

    if (spec.atmosphere) {
      const atmosphere = new THREE.Mesh(
        new THREE.SphereGeometry(radius * 1.05, 64, 48),
        new THREE.ShaderMaterial({
          uniforms: {
            uColor: { value: new THREE.Color(spec.atmosphere) },
          },
          vertexShader: `
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
              vec4 mv = modelViewMatrix * vec4(position, 1.0);
              vNormal = normalize(normalMatrix * normal);
              vView = normalize(-mv.xyz);
              gl_Position = projectionMatrix * mv;
            }
          `,
          fragmentShader: `
            uniform vec3 uColor;
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
              float rim = pow(1.0 - abs(dot(vNormal, vView)), 2.6);
              gl_FragColor = vec4(uColor, rim * 0.5);
            }
          `,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        })
      );
      atmosphere.renderOrder = 1;
      tilt.add(atmosphere);
      body.atmosphere = atmosphere;
    }

    if (spec.clouds) {
      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(radius * 1.012, 48, 32),
        new THREE.MeshStandardMaterial({
          map: createCloudTexture(spec.clouds),
          transparent: true,
          opacity: spec.clouds.opacity,
          depthWrite: false,
          roughness: 1,
          metalness: 0,
        })
      );
      clouds.renderOrder = 2;
      tilt.add(clouds);
      body.clouds = clouds;
    }

    if (spec.ring) {
      const ringMesh = makeRingMesh(
        radius * spec.ring.inner,
        radius * spec.ring.outer,
        createRingTexture(spec.ring)
      );
      tilt.add(ringMesh);
      body.rings = ringMesh;
    }

    if (spec.moon) {
      const moonPivot = new THREE.Object3D();
      pivot.add(moonPivot);

      const moonOrbit = makeOrbitLine(MOON_ORBIT, '#9aa3b0');
      moonOrbit.material.opacity = 0.1;
      pivot.add(moonOrbit);

      const moonMesh = new THREE.Mesh(
        new THREE.SphereGeometry(MOON_RADIUS, 32, 24),
        new THREE.MeshStandardMaterial({
          map: createSurfaceTexture({
            kind: 'rocky', seed: 151, period: 7,
            base: '#9a958c', dark: '#615d57', light: '#d4cec2', craters: 60,
          }),
          roughness: 1,
          metalness: 0,
        })
      );
      moonPivot.add(moonMesh);

      moonRecord = {
        id: 'moon',
        name: 'Moon',
        kind: 'Moon',
        color: '#cfc9bd',
        radius: MOON_RADIUS,
        group: moonMesh,
        facts: MOON_FACTS,
        fact: 'Tidally locked: one face always looks at Earth.',
        pickable: moonMesh,
      };
      moonMesh.userData.body = moonRecord;
      pickables.push(moonMesh);
      bodies.push(moonRecord);

      body.moon = {
        pivot: moonPivot,
        mesh: moonMesh,
        distance: MOON_ORBIT,
        startAngle: 0.8,
      };
    }

    planets.push(body);
    bodies.push(body);
  }
}

/* ------------------------------------------------------------------ *
 * 10. Labels
 * ------------------------------------------------------------------ */

function buildLabels() {
  for (let i = 0; i < bodies.length; i += 1) {
    const body = bodies[i];
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'label';
    el.style.setProperty('--dot', body.color);
    el.setAttribute('aria-label', 'Focus ' + body.name);

    const dot = document.createElement('span');
    dot.className = 'label-dot';
    const text = document.createElement('span');
    text.textContent = body.name;

    el.append(dot, text);
    el.addEventListener('click', () => selectBody(body));
    body.label = el;
    labelLayer.append(el);
  }
}

function hideLabel(el) {
  el.style.opacity = '0';
  el.style.pointerEvents = 'none';
}

function updateLabels() {
  const width = viewport.x;
  const height = viewport.y;
  const halfFov = Math.tan(camera.fov * 0.5 * DEG);
  const placed = [];

  for (let i = 0; i < bodies.length; i += 1) {
    const body = bodies[i];
    const el = body.label;
    if (!el) continue;

    body.group.getWorldPosition(tmpA);
    const distance = camera.position.distanceTo(tmpA);
    tmpB.copy(tmpA).project(camera);

    let visible = tmpB.z < 1 && tmpB.z > -1;
    if (body.id === 'moon') {
      const nearEarth = state.focus === body || state.focus === planets[2] || distance < 55;
      visible = visible && nearEarth;
    }

    if (!visible) {
      hideLabel(el);
      continue;
    }

    const x = (tmpB.x * 0.5 + 0.5) * width;
    const y = (-tmpB.y * 0.5 + 0.5) * height;
    const screenRadius = (body.radius / distance) * (height / (2 * halfFov));
    let top = Math.max(y - screenRadius - 9, 14);

    /* Stack a label upward while it overlaps one already placed. */
    for (let pass = 0; pass < 6; pass += 1) {
      let clash = null;
      for (let p = 0; p < placed.length; p += 1) {
        const other = placed[p];
        if (Math.abs(x - other.x) < 66 && Math.abs(top - other.y) < 15) {
          clash = other;
          break;
        }
      }
      if (!clash) break;
      top = clash.y - 16;
    }

    if (x < 36 || x > width - 36 || top < 24 || top > height - 12) {
      hideLabel(el);
      continue;
    }

    placed.push({ x, y: top });
    el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + top.toFixed(1) + 'px,0) translate(-50%,-100%)';
    el.style.opacity = body === state.focus ? '1' : '0.78';
    el.style.pointerEvents = 'auto';
  }
}

function updateLabelSelection() {
  for (let i = 0; i < bodies.length; i += 1) {
    const body = bodies[i];
    if (body.label) body.label.classList.toggle('is-active', body === state.focus);
  }
}

/* ------------------------------------------------------------------ *
 * 11. Camera focus and picking
 * ------------------------------------------------------------------ */

/* Fit the whole system into the narrower field of view: the height on a
   desktop, the width on a phone. Returns a camera position around the origin. */
function overviewPosition() {
  const elevation = (camera.aspect < 1 ? 40 : 30) * DEG;
  const vHalf = Math.tan((camera.fov * DEG) / 2);
  const hHalf = vHalf * camera.aspect;

  const horizontal = OVERVIEW_RADIUS / hHalf + OVERVIEW_RADIUS * Math.cos(elevation);
  const vertical = (OVERVIEW_RADIUS * Math.sin(elevation)) / vHalf + OVERVIEW_RADIUS * Math.cos(elevation);
  const distance = Math.max(horizontal, vertical) * 1.06;

  return new THREE.Vector3(0, distance * Math.sin(elevation), distance * Math.cos(elevation));
}

function setupControls() {
  controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.rotateSpeed = 0.55;
  controls.zoomSpeed = 0.9;
  controls.panSpeed = 0.7;
  controls.minDistance = 6;
  controls.maxDistance = 980;
  controls.screenSpacePanning = true;
  controls.update();
}

/* A three-quarter view from just sunward of the terminator, lifted off the
   ecliptic, so every body arrives lit and ringed planets show their rings. */
function focusDirection(world) {
  const toSun = new THREE.Vector3().subVectors(sunGroup.position, world);
  if (toSun.lengthSq() < 0.0001) toSun.set(0, 0, 1);
  toSun.normalize();

  const side = new THREE.Vector3().crossVectors(toSun, WORLD_UP);
  if (side.lengthSq() < 0.0001) side.set(1, 0, 0);
  side.normalize();

  return side.multiplyScalar(0.82)
    .addScaledVector(WORLD_UP, 0.6)
    .addScaledVector(toSun, 0.18)
    .normalize();
}

function selectBody(body, options = {}) {
  const instant = options.instant === true;

  state.focus = body;
  state.follow = null;
  state.tween = null;
  updateLabelSelection();
  renderPanel(body);

  const world = body.group.getWorldPosition(new THREE.Vector3());
  const dir = focusDirection(world);
  const framing = body.rings ? 7.6 : 6;
  const distance = Math.max(body.radius * framing + 3, 4.5);
  const goal = world.clone().addScaledVector(dir, distance);

  if (instant) {
    camera.position.copy(goal);
    controls.target.copy(world);
    controls.update();
    state.follow = body;
    renderPanel(state.focus);
    return;
  }

  state.tween = {
    body,
    fromPos: camera.position.clone(),
    fromTarget: controls.target.clone(),
    dir,
    distance,
    t: 0,
    duration: reduceMotion ? 0.35 : 1.15,
  };
  renderPanel(state.focus);
}

function goOverview(options = {}) {
  const instant = options.instant === true;
  state.focus = sunRecord;
  state.follow = null;
  state.tween = null;
  updateLabelSelection();
  renderPanel(sunRecord);

  const target = new THREE.Vector3(0, 0, 0);
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const goal = overviewPosition();

  if (instant) {
    camera.position.copy(goal);
    controls.target.copy(target);
    controls.update();
    renderPanel(state.focus);
    return;
  }

  state.tween = {
    body: null,
    fromPos,
    fromTarget,
    goalPos: goal,
    goalTarget: target,
    t: 0,
    duration: reduceMotion ? 0.4 : 1.3,
  };
  renderPanel(state.focus);
}

function setupPicking() {
  let down = null;

  canvas.addEventListener('pointerdown', (event) => {
    down = { x: event.clientX, y: event.clientY, button: event.button };

    if (event.button === 2 || event.shiftKey) {
      state.follow = null;
      renderPanel(state.focus);
    }
    if (state.tween) {
      state.follow = state.tween.body;
      state.tween = null;
      renderPanel(state.focus);
    }
  });

  canvas.addEventListener('pointerup', (event) => {
    if (!down) return;

    const moved = Math.hypot(event.clientX - down.x, event.clientY - down.y);
    const isPrimary = down.button === 0;
    down = null;

    if (!isPrimary || moved > 6) return;

    pointer.set(
      (event.clientX / window.innerWidth) * 2 - 1,
      -(event.clientY / window.innerHeight) * 2 + 1
    );

    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    if (hits.length > 0) selectBody(hits[0].object.userData.body);
  });

  canvas.addEventListener('pointercancel', () => { down = null; });
}

/* ------------------------------------------------------------------ *
 * 12. HUD
 * ------------------------------------------------------------------ */

function renderPanel(body) {
  if (!body) return;

  els.kind.textContent = state.follow === body ? body.kind + ' \u00b7 following' : body.kind;
  els.name.textContent = body.name;

  let rows = '';
  for (let i = 0; i < body.facts.length; i += 1) {
    rows += '<div class="fact"><dt>' + body.facts[i][0] + '</dt><dd>' + body.facts[i][1] + '</dd></div>';
  }
  els.facts.innerHTML = rows;
  els.note.textContent = body.fact;
}

function setPaused(paused) {
  state.paused = paused;
  els.play.dataset.state = paused ? 'paused' : 'playing';
  els.play.setAttribute('aria-pressed', paused ? 'true' : 'false');
  els.play.setAttribute('title', paused ? 'Play (Space)' : 'Pause (Space)');
  els.playText.textContent = paused ? 'Play' : 'Pause';
}

const SPEED_MIN = 0.1;
const SPEED_MAX = 8;

function sliderToSpeed(value) {
  return SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, value / 100);
}

function setSpeedFromSlider(value) {
  const speed = sliderToSpeed(value);
  state.speed = speed;
  els.speed.style.setProperty('--fill', value + '%');
  els.speedValue.textContent = (speed < 1 ? speed.toFixed(2) : speed.toFixed(1)) + '\u00d7';
}

function setupHUD() {
  els.play.addEventListener('click', () => setPaused(!state.paused));
  els.overview.addEventListener('click', () => goOverview());

  els.speed.addEventListener('input', (event) => {
    setSpeedFromSlider(Number(event.target.value));
  });

  window.addEventListener('keydown', (event) => {
    const tag = event.target.tagName;
    if (tag === 'INPUT' || tag === 'BUTTON' || tag === 'TEXTAREA') {
      if (event.key !== 'Escape') return;
    }

    if (event.code === 'Space') {
      event.preventDefault();
      setPaused(!state.paused);
      return;
    }

    if (event.key === 'Escape') {
      goOverview();
      return;
    }

    if (event.key === 'r' || event.key === 'R') {
      goOverview();
      return;
    }

    if (event.key === '0') {
      selectBody(sunRecord);
      return;
    }

    const digit = Number(event.key);
    if (digit >= 1 && digit <= 8 && planets[digit - 1]) {
      selectBody(planets[digit - 1]);
    }
  });

  setSpeedFromSlider(Number(els.speed.value));
  setPaused(false);
}

/* ------------------------------------------------------------------ *
 * 13. Simulation
 * ------------------------------------------------------------------ */

function updateBodies() {
  const t = state.simTime;

  if (sunMesh) sunMesh.rotation.y = t * 0.035;

  for (let i = 0; i < planets.length; i += 1) {
    const planet = planets[i];

    const angle = planet.startAngle + (t / (planet.periodYears * YEAR_SECONDS)) * TAU;
    planet.pivot.position.set(Math.cos(angle) * planet.distance, 0, Math.sin(angle) * planet.distance);

    planet.mesh.rotation.y = (t / planet.spinPeriod) * TAU * planet.spinDir;
    if (planet.clouds) planet.clouds.rotation.y = planet.mesh.rotation.y * 1.08;

    if (planet.moon) {
      const moonAngle = planet.moon.startAngle + (t / MOON_SECONDS) * TAU;
      planet.moon.pivot.position.set(
        Math.cos(moonAngle) * planet.moon.distance,
        0,
        Math.sin(moonAngle) * planet.moon.distance
      );
      planet.moon.mesh.rotation.y = moonAngle;
    }
  }

  if (starLayerBright) {
    starLayerBright.material.opacity = 0.7 + Math.sin(t * 1.7) * 0.12;
  }
}

function updateCamera(dt) {
  const tween = state.tween;

  if (tween) {
    tween.t += dt;
    const k = easeInOutCubic(clamp(tween.t / tween.duration));

    if (tween.body) {
      const world = tween.body.group.getWorldPosition(tmpA);
      tmpB.copy(world).addScaledVector(tween.dir, tween.distance);
      camera.position.lerpVectors(tween.fromPos, tmpB, k);
      controls.target.lerpVectors(tween.fromTarget, world, k);
    } else {
      camera.position.lerpVectors(tween.fromPos, tween.goalPos, k);
      controls.target.lerpVectors(tween.fromTarget, tween.goalTarget, k);
    }

    if (tween.t >= tween.duration) {
      state.follow = tween.body;
      state.tween = null;
      renderPanel(state.focus);
    }
  } else if (state.follow) {
    const world = state.follow.group.getWorldPosition(tmpA);
    tmpB.copy(world).sub(controls.target);
    camera.position.add(tmpB);
    controls.target.copy(world);
  }

  controls.update();
}

function onResize() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  viewport.set(width, height);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(width, height, false);
}

/* ------------------------------------------------------------------ *
 * 14. Loop and boot
 * ------------------------------------------------------------------ */

function tick() {
  const raw = clock.getDelta();
  const step = Math.min(raw, 0.05);

  if (!state.paused) state.simTime += step * state.speed;

  updateBodies();
  /* Camera motion follows real time, so slow frames do not stretch the tween. */
  updateCamera(Math.min(raw, 0.25));
  updateLabels();

  renderer.render(scene, camera);
}

function fail(message) {
  if (!els.bootNote) return;
  els.bootNote.dataset.filled = '1';
  els.bootNote.textContent = message;
  els.bootNote.classList.add('is-error');
}

function revealPage() {
  window.__solarReady = true;

  if (!els.boot) return;
  els.boot.classList.add('is-hidden');
  const bootEl = els.boot;
  window.setTimeout(() => {
    if (bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
  }, 600);
}

function init() {
  if (!setupRenderer()) return;

  setupScene();
  buildStarfield();
  buildSun();
  buildPlanets();
  buildLabels();
  setupControls();
  setupPicking();
  setupHUD();

  onResize();
  window.addEventListener('resize', onResize);

  camera.position.copy(overviewPosition());
  controls.update();

  state.focus = sunRecord;
  updateLabelSelection();
  renderPanel(sunRecord);

  updateBodies();
  updateLabels();
  renderer.render(scene, camera);

  clock.start();
  renderer.setAnimationLoop(tick);
  revealPage();
}

try {
  init();
} catch (error) {
  fail('The model could not start: ' + (error && error.message ? error.message : 'unknown error'));
  if (window.console) console.error(error);
}
</script>
</body>
</html>
